name: Release Artifacts & SHA-256 Checksums

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_and_attest:
    name: Pack Tarball & Generate SHA256SUMS
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install toolchain dependencies
        run: npm install --no-audit --no-fund

      - name: Verify lint, strict types, build, tests, and CLI self-test
        run: |
          npm run lint
          npm run typecheck
          npm run build
          npm test
          node dist/cli/bin.js self-test

      - name: Create deterministic npm tarball and SHA256SUMS.txt
        run: |
          TARBALL="$(npm pack --quiet | tail -n 1)"
          echo "Packed artifact: $TARBALL"
          sha256sum "$TARBALL" > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
          cat SHA256SUMS.txt
          echo "TARBALL=$TARBALL" >> "$GITHUB_ENV"

      - name: Upload workflow build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mcp-warden-release-bundle
          path: |
            ${{ env.TARBALL }}
            SHA256SUMS.txt
          if-no-files-found: error

      - name: Attach tarball and SHA256SUMS.txt to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" "${{ env.TARBALL }}" SHA256SUMS.txt --clobber
